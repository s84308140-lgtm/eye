name: Update Loto Data

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and merge latest lottery results
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          DB_PATH = Path("lotodata.json")

          SOURCES = {
              "loto6": {
                  "url": "https://www.japannetbank.co.jp/lottery/co/loto6jnb.csv",
                  "picks": 6,
                  "bonus": 1,
              },
              "loto7": {
                  "url": "https://www.japannetbank.co.jp/lottery/co/loto7jnb.csv",
                  "picks": 7,
                  "bonus": 2,
              },
              "miniloto": {
                  "url": "https://www.japannetbank.co.jp/lottery/co/minilotojnb.csv",
                  "picks": 5,
                  "bonus": 1,
              },
          }

          FW_DIGITS = str.maketrans(
              "0123456789",
              "０１２３４５６７８９"
          )
          JST = timezone(timedelta(hours=9))

          def fetch_csv(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (LotoNoMe GitHub Updater)",
                      "Accept": "text/csv,*/*;q=0.8",
                      "Accept-Language": "ja-JP,ja;q=0.9",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  raw = response.read()

              for encoding in (
                  "cp932",
                  "shift_jis",
                  "utf-8-sig",
                  "utf-8"
              ):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue

              raise RuntimeError(
                  "CSVの文字コードを判定できません"
              )

          def get_value(row, names):
              for name in names:
                  value = row.get(name)

                  if (
                      value is not None
                      and str(value).strip()
                  ):
                      return (
                          str(value)
                          .strip()
                          .replace('"', "")
                      )

              return None

          def parse_round(value):
              match = re.search(
                  r"(\d+)",
                  str(value or "")
              )

              return (
                  int(match.group(1))
                  if match
                  else None
              )

          def parse_csv(
              text,
              picks,
              bonus_count
          ):
              reader = csv.DictReader(
                  io.StringIO(text)
              )

              records = []

              for row in reader:

                  round_no = parse_round(
                      row.get("回号")
                  )

                  if round_no is None:
                      continue

                  numbers = []

                  for i in range(
                      1,
                      picks + 1
                  ):
                      fw = str(i).translate(
                          FW_DIGITS
                      )

                      value = get_value(
                          row,
                          [
                              f"抽せん数字{i}",
                              f"抽せん数字{fw}"
                          ],
                      )

                      if value is None:
                          numbers = []
                          break

                      numbers.append(
                          int(value)
                      )

                  if len(numbers) != picks:
                      continue

                  bonuses = []

                  if bonus_count == 1:

                      value = get_value(
                          row,
                          ["ボーナス数字"]
                      )

                      if value is not None:
                          bonuses.append(
                              int(value)
                          )

                  else:

                      for i in range(
                          1,
                          bonus_count + 1
                      ):

                          fw = str(i).translate(
                              FW_DIGITS
                          )

                          value = get_value(
                              row,
                              [
                                  f"ボーナス数字{i}",
                                  f"ボーナス数字{fw}"
                              ],
                          )

                          if value is not None:
                              bonuses.append(
                                  int(value)
                              )

                  date_text = (
                      get_value(
                          row,
                          ["抽せん日"]
                      )
                      or ""
                  )

                  records.append(
                      {
                          "round": round_no,
                          "date": date_text.replace(
                              "/",
                              "-"
                          ),
                          "numbers": sorted(
                              numbers
                          ),
                          "bonus": bonuses,
                      }
                  )

              return records

          def normalize_existing(item):

              numbers = item.get(
                  "numbers",
                  item.get(
                      "nums",
                      item.get(
                          "picks",
                          []
                      )
                  )
              )

              bonus = item.get(
                  "bonus",
                  item.get(
                      "bonuses",
                      []
                  )
              )

              return {
                  "round": int(
                      item["round"]
                  ),
                  "date": str(
                      item.get(
                          "date",
                          ""
                      )
                  ),
                  "numbers": [
                      int(n)
                      for n in numbers
                  ],
                  "bonus": [
                      int(n)
                      for n in bonus
                  ],
              }

          def merge(
              existing,
              incoming
          ):

              by_round = {}

              for item in existing:

                  if (
                      not isinstance(
                          item,
                          dict
                      )
                      or "round" not in item
                  ):
                      continue

                  fixed = (
                      normalize_existing(
                          item
                      )
                  )

                  by_round[
                      fixed["round"]
                  ] = fixed

              changed = 0

              for item in incoming:

                  old = by_round.get(
                      item["round"]
                  )

                  if old != item:

                      by_round[
                          item["round"]
                      ] = item

                      changed += 1

              merged = [
                  by_round[r]
                  for r in sorted(
                      by_round
                  )
              ]

              return (
                  merged,
                  changed
              )

          if not DB_PATH.exists():
              raise RuntimeError(
                  "lotodata.json が見つかりません"
              )

          database = json.loads(
              DB_PATH.read_text(
                  encoding="utf-8"
              )
          )

          total_changed = 0

          for game, config in (
              SOURCES.items()
          ):

              csv_text = fetch_csv(
                  config["url"]
              )

              incoming = parse_csv(
                  csv_text,
                  config["picks"],
                  config["bonus"],
              )

              if not incoming:
                  raise RuntimeError(
                      f"{game}: CSVから抽せん結果を読み取れませんでした"
                  )

              existing = database.get(
                  game,
                  []
              )

              merged, changed = merge(
                  existing,
                  incoming
              )

              database[game] = merged
              total_changed += changed

              latest = merged[-1]

              print(
                  f"{game}: "
                  f"{len(merged)}件 / "
                  f"変更 {changed}件 / "
                  f"最新 第{latest['round']}回 "
                  f"({latest['date']})"
              )

          if total_changed == 0:

              print(
                  "新しい抽せん結果はありません。"
              )

          else:

              database["version"] = "1.4"

              database["updated"] = (
                  datetime.now(JST)
                  .date()
                  .isoformat()
              )

              database[
                  "source_latest"
              ] = (
                  "PayPay銀行 当せん情報CSV"
              )

              DB_PATH.write_text(
                  json.dumps(
                      database,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              print(
                  "lotodata.json を更新しました。"
                  f"変更合計: {total_changed}件"
              )

          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- lotodata.json; then
            echo "lotodata.json に変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lotodata.json
          git commit -m "Auto-update lottery results"
          git push
